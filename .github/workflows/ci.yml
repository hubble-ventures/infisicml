name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck, test, build, and smoke across the two most recent Node LTS lines.
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # smoke test's `diff` needs git history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The action bundle and JSON schema are committed (the Action runs with no
      # build step). Fail if either drifted from source.
      - name: Verify committed action bundle + schema are up to date
        run: |
          if ! git diff --exit-code -- action/index.cjs schema; then
            echo "::error::action/index.cjs or schema/ is stale — run 'pnpm build' and commit the result"
            exit 1
          fi

      - name: Smoke test the built CLI
        run: node scripts/smoke.mjs

  # Prove the published package installs and runs under every major package
  # manager (it's manager-agnostic — nothing pnpm-only leaks into the tarball).
  install-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the tarball
        run: echo "TARBALL=$(pnpm pack | tail -1)" >> "$GITHUB_ENV"
      - name: Install the tarball with ${{ matrix.manager }} and run the CLI
        run: |
          set -euo pipefail
          mkdir /tmp/consumer && cd /tmp/consumer
          case "${{ matrix.manager }}" in
            npm)  npm init -y >/dev/null && npm install "$GITHUB_WORKSPACE/$TARBALL" ;;
            pnpm) pnpm init >/dev/null && pnpm add "$GITHUB_WORKSPACE/$TARBALL" ;;
            yarn) corepack enable && yarn init -y >/dev/null \
              && yarn config set nodeLinker node-modules \
              && yarn add "$GITHUB_WORKSPACE/$TARBALL" ;;
          esac
          ./node_modules/.bin/infisicml --help | grep -q "infisicml"
