name: E2E (bundled action, live Infisical)

# Manually-dispatched, end-to-end proof that the committed JS action does the
# full CI lane: GitHub OIDC -> Infisical machine identity -> secrets masked and
# appended to GITHUB_ENV. It runs the action from this checkout against a REAL
# (sandbox) Infisical project.
#
# One-time setup (repo or environment settings → Variables):
#   INFISICAL_IDENTITY_ID    machine identity bound to a GitHub OIDC auth method
#   INFISICAL_OIDC_AUDIENCE  (optional) audience the identity expects
#   INFISICML_E2E_ENVIRONMENT   Infisical env slug (default: development)
#   INFISICML_E2E_EXPECT_KEY    (optional) an env-var name the action should export
#
# The checkout must contain a sandbox `secrets.yaml` whose `project` is the
# sandbox project slug (a small fixture at the repo root is fine). Without the
# required vars the job fails early with instructions.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Infisical env slug"
        required: false
        default: development

permissions:
  id-token: write # OIDC — the only CI auth lane
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required sandbox config present
        env:
          IDENTITY: ${{ vars.INFISICAL_IDENTITY_ID }}
        run: |
          if [ -z "$IDENTITY" ]; then
            echo "::error::Missing INFISICAL_IDENTITY_ID — set it as a repo Variable and add a sandbox secrets.yaml (with its project slug) before running the e2e."
            exit 1
          fi
          if [ ! -f secrets.yaml ] && [ ! -f secrets.yml ]; then
            echo "::error::No secrets.yaml found at the repo root — add a sandbox manifest first."
            exit 1
          fi

      - name: Pull secrets via the bundled action (OIDC)
        uses: ./action
        with:
          command: pull
          environment: ${{ inputs.environment || vars.INFISICML_E2E_ENVIRONMENT || 'development' }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}

      - name: Assert a secret reached GITHUB_ENV
        env:
          EXPECT: ${{ vars.INFISICML_E2E_EXPECT_KEY }}
        run: |
          if [ -z "${EXPECT:-}" ]; then
            echo "No INFISICML_E2E_EXPECT_KEY set — action completed without error; skipping value assertion."
            exit 0
          fi
          if [ -z "${!EXPECT:-}" ]; then
            echo "::error::Expected key '$EXPECT' not present in job env after the action ran."
            exit 1
          fi
          echo "OK: '$EXPECT' was exported to GITHUB_ENV by the action (value masked)."
