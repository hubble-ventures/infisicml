name: infisicml
description: >-
  Pull, validate, or diff Infisical secret manifests. Authentication is GitHub
  OIDC — the calling job MUST set `permissions: id-token: write` for commands
  that read the vault (pull, validate --against-vault).

inputs:
  command:
    description: 'What to do: pull | validate | diff'
    required: true
  environment:
    description: 'Infisical environment slug (development, staging, production)'
    required: false
    default: ''
  profile:
    description: 'Optional manifest profile whose secrets replace the root ones'
    required: false
    default: ''
  ids:
    description: 'Restrict to these manifest ids (space/comma separated). Default: all discovered.'
    required: false
    default: ''
  identity-id:
    description: 'Infisical machine-identity id bound to a GitHub OIDC auth method (required for pull / --against-vault)'
    required: false
    default: ''
  oidc-audience:
    description: 'OIDC audience the identity expects (optional)'
    required: false
    default: ''
  base:
    description: 'diff only: git ref to compare against (e.g. the PR base branch)'
    required: false
    default: ''
  against-vault:
    description: 'validate only: also check declared keys exist in the vault'
    required: false
    default: 'false'
  check-values:
    description: 'validate only: also flag present-but-empty required keys (implies a value read)'
    required: false
    default: 'false'
  comment:
    description: 'diff only: upsert a sticky PR comment with the manifest delta'
    required: false
    default: 'false'
  fail-on-change:
    description: 'diff only: fail the step when the manifest surface changed'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to post the PR comment (usually ${{ github.token }})'
    required: false
    default: ${{ github.token }}

outputs:
  changed:
    description: 'diff: whether any manifest changed'
  added:
    description: 'diff: total added variables'
  removed:
    description: 'diff: total removed variables'
  count:
    description: 'pull: total exported variables'

runs:
  using: node24
  main: index.cjs
