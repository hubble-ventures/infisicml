# yaml-language-server: $schema=../schema/secrets.schema.json
#
# A package's secret manifest. Drop one `secrets.yaml` in each app/package that
# needs secrets; infisicml discovers them all. Pull writes the resolved values
# next to this file (see `defaults.output`).
version: 1

# Infisical project slug the secrets live in.
project: acme-payments

defaults:
  environment: development
  output: .env.secrets
  # `folder` reads whole folders and selects locally; `keys` reads only the
  # declared keys (least privilege at the wire).
  fetch: folder

# Ordered folder blocks: which keys to pull, and how to alias them.
secrets:
  - path: /payments/stripe
    keys:
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET: WEBHOOK_SECRET # alias source → target
  - path: /shared
    keys:
      - DATABASE_URL
      - DEBUG_TOKEN

# Named alternates that replace `secrets` when selected with --profile.
profiles:
  deploy:
    fetch: keys
    secrets:
      - path: /payments/stripe
        keys: [STRIPE_SECRET_KEY]

# Per-environment overrides — here, a key allowed to be absent in production.
environments:
  production:
    optional: [DEBUG_TOKEN]
